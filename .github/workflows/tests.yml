name: Tests

on:
  push:
  pull_request:

# El job solo hace checkout, instala dependencias, ejecuta tests y sube el
# reporte como artefacto — no necesita escribir en el repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    # TEST-04: PostgreSQL y Redis reales para tests/integration/ (sin ellos esos
    # tests se saltaban siempre). SQLite e in-process siguen siendo el default.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: camara_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://postgres:test@localhost:55432/camara_test
      TEST_REDIS_URL: redis://localhost:56379/0

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # DEPS-01: requirements-dev.txt = ejecucion + pytest, ruff y scikit-image.
      # Sin el paso de dlib/face_recognition: el reconocimiento usa insightface.
      - name: Install Python deps
        run: pip install -q -r requirements-dev.txt

      # DX-02: errores de sintaxis y de pyflakes (imports rotos, nombres sin definir).
      - name: Lint (ruff E9,F)
        run: ruff check backend tests scripts

      # TEST-04: unit + integración en cada push. tests/ incluye tests/integration/
      # (Fase 34) sin flag aparte -- pytest recorre el arbol completo. Antes llevaba
      # continue-on-error: true, que enmascaraba cualquier fallo (el job quedaba en
      # verde pasara lo que pasara); un push que rompe algo real debe romper el build.
      # DX-02: una sola pasada con cobertura (antes la suite corria dos veces).
      # TEST-05/TEST-03: events, pipeline, perception, storage, api/v2 y main.py por
      # encima del umbral de .coveragerc. -m "not perf" excluye los tests de
      # latencia con margenes estrechos: el trazado linea a linea de coverage.py
      # infla el tiempo de las rutas con mucho glue Python (YOLO) y cuela
      # regresiones falsas -- ver tests/test_detector.py:TEST_multiclass_latency_under_15_percent.
      # -rs lista el motivo de cada test saltado, para que un skip no pase inadvertido.
      - name: Run tests with coverage gate
        run: |
          pytest tests/ -q -rs --tb=short -m "not perf" \
            --cov --cov-report=term-missing \
            --html=report/index.html \
            --self-contained-html

      # Los tests de latencia, aparte y sin coverage.py.
      - name: Run perf tests
        run: pytest tests/ -q -rs --tb=short -m perf

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-${{ github.run_number }}
          path: report/index.html
          retention-days: 30

  # TEST-04 (mitad "PR") y TEST-02: E2E en pull_request y en los push a main, no en
  # cada push a cualquier rama -- Playwright levanta el backend real completo
  # (YOLO26n incluido) y es bastante mas caro que el job de arriba. CAMERA_URL se
  # deja en su valor por defecto: los escenarios de tests/e2e/ estan pensados para una camara inalcanzable (ver comentarios en
  # cada spec), asi que no hace falta credencial ni camara real tampoco aqui.
  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install -q -r requirements.txt

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node deps
        run: npm ci

      # Solo Chromium (unico proyecto en playwright.config.js): mismo criterio de
      # CPU/dependencias moderadas que el resto del proyecto (CLAUDE.md).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 30
