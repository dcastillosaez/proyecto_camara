[pytest]
# TEST-01: en Windows la comparación de patrones ignora mayúsculas y `TEST_*`
# recogía también `test_*`; en Linux (CI) no, y 79 funciones no corrían nunca.
# Se declaran los dos estilos; tests/test_collection.py falla si alguno queda fuera.
python_functions = TEST_* test_*
asyncio_mode = auto
markers =
    perf: mide latencia real con margenes estrechos -- excluir de runs con
        cobertura (el trazado linea a linea de coverage.py infla el tiempo
        de las rutas con mucho glue Python, como la inferencia de YOLO, y
        puede colar una regresion falsa).
